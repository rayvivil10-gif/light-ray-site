<!-- 
  ANIMATION LOGO QUI S'ÉVAPORE / SE DISSOUT
  À copier-coller dans light-ray-site
  ================================== -->

<!-- 1) À mettre juste après <body> (avant ton header actuel) -->
<div id="liquid-intro">
  <svg width="0" height="0" style="position:absolute">
    <filter id="dissolve">
      <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.012 0.04" numOctaves="2" seed="7" result="noise">
        <animate attributeName="baseFrequency" from="0.005 0.02" to="0.03 0.15" dur="2.2s" begin="0.6s" fill="freeze" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G">
        <animate attributeName="scale" from="0" to="90" dur="2.2s" begin="0.6s" fill="freeze" />
      </feDisplacementMap>
    </filter>
  </svg>

  <div class="logo-stage">
    <img src="/lr-icon.png" alt="LR" class="logo-img" />
    <!-- petites particules de "vapeur" qui montent -->
    <span class="wisp w1"></span>
    <span class="wisp w2"></span>
    <span class="wisp w3"></span>
    <span class="wisp w4"></span>
    <span class="wisp w5"></span>
    <span class="wisp w6"></span>
  </div>
</div>

<!-- 2) CSS à ajouter dans ton <style> ou fichier .css -->
<style>
#liquid-intro {
  position: fixed;
  inset: 0;
  background: #131722; /* même navy que ton fond */
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeOutIntro 0.7s ease 2.6s forwards;
  pointer-events: none;
}

.logo-stage {
  position: relative;
  width: 140px;
  height: 140px;
}

.logo-img {
  width: 100%;
  height: 100%;
  filter: url(#dissolve);
  animation: logoFade 2.2s ease 0.6s forwards, logoRise 2.2s ease-in 0.6s forwards;
  opacity: 1;
}

@keyframes logoFade {
  0%   { opacity: 1; }
  60%  { opacity: 0.7; }
  100% { opacity: 0; }
}

@keyframes logoRise {
  0%   { transform: translateY(0) scale(1); }
  100% { transform: translateY(-18px) scale(1.08); }
}

/* petites volutes qui montent comme de la vapeur/fumée dorée */
.wisp {
  position: absolute;
  bottom: 20px;
  width: 6px;
  height: 6px;
  background: #D4AF37;
  border-radius: 50%;
  opacity: 0;
  filter: blur(1px);
  animation: wispUp 1.8s ease-out forwards;
}
.w1 { left: 30px;  animation-delay: 0.9s; }
.w2 { left: 55px;  animation-delay: 1.1s; }
.w3 { left: 75px;  animation-delay: 0.95s; }
.w4 { left: 95px;  animation-delay: 1.2s; }
.w5 { left: 45px;  animation-delay: 1.35s; }
.w6 { left: 105px; animation-delay: 1.0s; }

@keyframes wispUp {
  0%   { opacity: 0; transform: translateY(0) scale(1); }
  20%  { opacity: 0.8; }
  100% { opacity: 0; transform: translateY(-70px) scale(0.3); }
}

@keyframes fadeOutIntro {
  to { opacity: 0; visibility: hidden; }
}
</style>

<!--
  NOTES POUR RAY :

  1. IMPORTANT : remplace src="/lr-icon.png" par le chemin réel de ton image 
     LR sur le repo (uploade l'image "170311.png" à la racine du repo et renomme-la 
     "lr-icon.png", ou adapte le chemin dans le code).

  2. Comment ça marche : 
     - Le logo est net au départ.
     - À 0.6s, un filtre SVG (feTurbulence + feDisplacementMap) commence à "brouiller" 
       les pixels de façon organique, comme si le logo se liquéfiait.
     - En même temps il monte légèrement et s'estompe (comme de la vapeur).
     - De petites particules dorées montent autour, pour renforcer l'effet d'évaporation.
     - Après 2.6s, tout l'écran d'intro disparaît, révélant ton site.

  3. Pour ne l'afficher qu'une fois par visite, ajoute avant </body> :

  <script>
    if (sessionStorage.getItem('lr_intro_seen')) {
      document.getElementById('liquid-intro').style.display = 'none';
    } else {
      sessionStorage.setItem('lr_intro_seen', '1');
    }
  </script>

  4. Si l'effet de dissolution est trop subtil ou trop fort, ajuste le "to" de 
     baseFrequency (plus haut = plus chaotique) et le "to" de scale (plus haut = 
     déformation plus forte) dans le <animate>.
-->
