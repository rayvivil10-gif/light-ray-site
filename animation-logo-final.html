<div id="liquid-intro" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:#131722; z-index:99999; display:flex; align-items:center; justify-content:center; animation: lrFadeOut 0.7s ease 2.6s forwards;">
  <svg width="0" height="0" style="position:absolute">
    <filter id="dissolve">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.04" numOctaves="2" seed="7" result="noise">
        <animate attributeName="baseFrequency" from="0.005 0.02" to="0.03 0.15" dur="2.2s" begin="0.6s" fill="freeze" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G">
        <animate attributeName="scale" from="0" to="90" dur="2.2s" begin="0.6s" fill="freeze" />
      </feDisplacementMap>
    </filter>
  </svg>

  <div style="position:relative; width:140px; height:140px;">
    <img src="app-icon.png" alt="LR" style="width:100%; height:100%; object-fit:contain; filter:url(#dissolve); animation: lrLogoFade 2.2s ease 0.6s forwards, lrLogoRise 2.2s ease-in 0.6s forwards; opacity:1;" />
    <span style="position:absolute; bottom:20px; left:30px; width:6px; height:6px; background:#D4AF37; border-radius:50%; opacity:0; filter:blur(1px); animation: lrWispUp 1.8s ease-out 0.9s forwards;"></span>
    <span style="position:absolute; bottom:20px; left:55px; width:6px; height:6px; background:#D4AF37; border-radius:50%; opacity:0; filter:blur(1px); animation: lrWispUp 1.8s ease-out 1.1s forwards;"></span>
    <span style="position:absolute; bottom:20px; left:75px; width:6px; height:6px; background:#D4AF37; border-radius:50%; opacity:0; filter:blur(1px); animation: lrWispUp 1.8s ease-out 0.95s forwards;"></span>
    <span style="position:absolute; bottom:20px; left:95px; width:6px; height:6px; background:#D4AF37; border-radius:50%; opacity:0; filter:blur(1px); animation: lrWispUp 1.8s ease-out 1.2s forwards;"></span>
    <span style="position:absolute; bottom:20px; left:45px; width:6px; height:6px; background:#D4AF37; border-radius:50%; opacity:0; filter:blur(1px); animation: lrWispUp 1.8s ease-out 1.35s forwards;"></span>
    <span style="position:absolute; bottom:20px; left:105px; width:6px; height:6px; background:#D4AF37; border-radius:50%; opacity:0; filter:blur(1px); animation: lrWispUp 1.8s ease-out 1.0s forwards;"></span>
  </div>
</div>

<style>
@keyframes lrFadeOut { to { opacity:0; visibility:hidden; } }
@keyframes lrLogoFade { 0%{opacity:1;} 60%{opacity:0.7;} 100%{opacity:0;} }
@keyframes lrLogoRise { 0%{transform:translateY(0) scale(1);} 100%{transform:translateY(-18px) scale(1.08);} }
@keyframes lrWispUp { 0%{opacity:0; transform:translateY(0) scale(1);} 20%{opacity:0.8;} 100%{opacity:0; transform:translateY(-70px) scale(0.3);} }
</style>

<script>
  if (sessionStorage.getItem('lr_intro_seen')) {
    document.getElementById('liquid-intro').style.display = 'none';
  } else {
    sessionStorage.setItem('lr_intro_seen', '1');
  }
</script>
